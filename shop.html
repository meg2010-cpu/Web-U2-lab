<!DOCTYPE html>
<html lang="en">
<head>
    <title>Unit lab: CoffeeClicker!</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
</head>
<body class="shopscreen">
    <div id="timer" class="timer pixelify-sans">4:00</div>
    <nav>
        <ul>
            <li>
                <a href="home.html"> <img id="homelogo" src="home.png" alt="Home"> </a>
            </li>
            <li>
                <img id="moneylogo" src="money.png" alt="Money">
            </li>
            <li><h1 id="moneyAmount" class="pixelify-sans">$0.00</h1></li>
         </ul>
    </nav>
    <main class="shop-content">
        <h1 class="shop-title pixelify-sans">Coffee Shop</h1>
        <p id="shopMessage" class="shop-message"></p>
        <section class="shop-grid">
            <div class="shop-item" data-item="oat" data-price-cents="100">
                <img class="item-image" src="oat.png" alt="Oat milk">
                <p class="item-price">$1.00</p>
                <button class="buy-button" type="button"><img src="buybutton.png" alt="Buy" width="120"></button>
            </div>
            <div class="shop-item" data-item="almond" data-price-cents="125">
                <img class="item-image" src="almond.png" alt="Almond milk">
                <p class="item-price">$1.25</p>
                <button class="buy-button" type="button"><img src="buybutton.png" alt="Buy" width="120"></button>
            </div>
            <div class="shop-item" data-item="pumpkin" data-price-cents="200">
                <img class="item-image" src="pumpkin.png" alt="Pumpkin">
                <p class="item-price">$2.00</p>
                <button class="buy-button" type="button"><img src="buybutton.png" alt="Buy" width="120"></button>
            </div>
            <div class="shop-item" data-item="rainbow" data-price-cents="300">
                <img class="item-image" src="rainbow.png" alt="Rainbow topping">
                <p class="item-price">$3.00</p>
                <button class="buy-button" type="button"><img src="buybutton.png" alt="Buy" width="120"></button>
            </div>
            <div class="shop-item" data-item="choco" data-price-cents="150">
                <img class="item-image" src="choco.png" alt="Chocolate">
                <p class="item-price">$1.50</p>
                <button class="buy-button" type="button"><img src="buybutton.png" alt="Buy" width="120"></button>
            </div>
            <div class="shop-item" data-item="cinnamon" data-price-cents="100">
                <img class="item-image" src="cinnamon.png" alt="Cinnamon">
                <p class="item-price">$1.00</p>
                <button class="buy-button" type="button"><img src="buybutton.png" alt="Buy" width="120"></button>
            </div>
            <div class="shop-item" data-item="cream" data-price-cents="125">
                <img class="item-image" src="cream.png" alt="Cream">
                <p class="item-price">$1.25</p>
                <button class="buy-button" type="button"><img src="buybutton.png" alt="Buy" width="120"></button>
            </div>
            <div class="shop-item" data-item="drizzle" data-price-cents="250">
                <img class="item-image" src="drizzle.png" alt="Drizzle topping">
                <p class="item-price">$2.50</p>
                <button class="buy-button" type="button"><img src="buybutton.png" alt="Buy" width="120"></button>
            </div>
            <div class="shop-item" data-item="strawberry" data-price-cents="275">
                <img class="item-image" src="strawberry.png" alt="strawberry">
                <p class="item-price">$2.75</p>
                <button class="buy-button" type="button"><img src="buybutton.png" alt="Buy" width="120"></button>
            </div>
            <div class="shop-item" data-item="frappe" data-price-cents="400">
                <img class="item-image" src="frappe.png" alt="Frappe">
                <p class="item-price">$4.00</p>
                <button class="buy-button" type="button"><img src="buybutton.png" alt="Buy" width="120"></button>
            </div>
            <div class="shop-item" data-item="latte" data-price-cents="300">
                <img class="item-image" src="latte.png" alt="Latte">
                <p class="item-price">$3.00</p>
                <button class="buy-button" type="button"><img src="buybutton.png" alt="Buy" width="120"></button>
            </div>
            <div class="shop-item" data-item="sprinkles" data-price-cents="150">
                <img class="item-image" src="sprinkles.png" alt="Sprinkles">
                <p class="item-price">$1.50</p>
                <button class="buy-button" type="button"><img src="buybutton.png" alt="Buy" width="120"></button>
            </div>
        </section>
    </main>
    <div id="gameOverOverlay" class="overlay game-over-overlay" hidden></div>
    <section id="gameOverPopup" class="popup-box game-over-popup" hidden>
        <button id="gameOverClose" class="popup-close" type="button">&times;</button>
        <h2>Time's up!</h2>
        <p>You made <span id="shiftEarnings">$0.00</span> this shift.</p>
    </section>
    <script src="main.js" >

    </script>
</body>
</html>
