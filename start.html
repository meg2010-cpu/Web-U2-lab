<!DOCTYPE html>
<html lang="en">
<head>
    <title>Unit lab: CoffeeClicker!</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
</head>

<body class="background">

     <div id = "buttoncontainer">
        <div id="instructionbutton-container">
            <button id="instructionsBtn" class="instructions-trigger" type="button" aria-label="Open instructions">
                <img src="instructionbutton.png" alt="" height="155">
            </button>
        </div>
        
        <div id="playbutton-container">
            <a href="home.html"><img src="playbutton.png" alt="playbutton" height="140px" width="auto"></a>
        </div>
    </div>

    <div id="overlay" class="overlay" hidden></div>
    <section id="popup" class="popup-box" hidden>
        <button id="closeBtn" class="popup-close" type="button">&times;</button>
        <h2 id="popupTitle">Instructions</h2>
        <p>blahblahblah</p>
    </section>

    <script src="main.js" defer></script>
    <script>
        let instructionsButton = document.getElementById('instructionsBtn');
        let closeButton = document.getElementById('closeBtn');
        let popup = document.getElementById('popup');
        let overlay = document.getElementById('overlay');

        let closePopup = () => {
            popup.hidden = true;
            overlay.hidden = true;
            instructionsButton.focus();
        };

        instructionsButton.addEventListener('click', () => {
            popup.hidden = false;
            overlay.hidden = false;
            closeButton.focus();
        });
        closeButton.addEventListener('click', closePopup);
    </script>
</body>
</html>
