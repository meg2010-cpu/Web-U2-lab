<!DOCTYPE html>
<html lang="en">
<head>
    <title>Unit lab: CoffeeClicker!</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
</head>
<body class="gamescreen">
    <nav>
        <ul>
            <li>
                <a href="shop.html"> <img id="shoplogo" src="store.png" alt="Shop"> </a>
            </li>
            <li>
                <img id="moneylogo" src="money.png" alt="Shop">
            </li>
            <li><h1 id="moneyAmount" class="pixelify-sans">$0.00</h1></li>
         </ul>
    </nav>
    <div class="ticket">

        <div class="ticket-text pixelify-sans">
             <p>here is an order</p>
             <ul id="recipe-items">

             </ul>
        </div>
       
        <div class="sendbutton-container">
            <img id="sendbutton" src="sendbutton.png" alt="sendbutton" height="50px" width="auto">
        </div>
    </div>
    <div class="allitems">
        <div class="leftside">
            <img id="coffee" src="machine.png" height="250px" width="auto">
            <img id="2%" src="2percent.png" height="100px" width="auto">
            <img id="oat" src="oat.png" height="100px" width="auto">
            <img id="almond" src="almond.png" height="100px" width="auto">

        </div>

        <div class="rightside">
            <img id="vanilla" src="vanilla.png" height="150px" width="auto">
        </div> 
    </div>


<script src="main.js" ></script>
</body>
</html>
