<!DOCTYPE html>
<html lang="en">
<head>
    <title>Unit lab: CoffeeClicker!</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
</head>
<body class="gamescreen">
    <div id="timer" class="timer pixelify-sans">4:00</div>
    <nav>
        <ul>
            <li>
                <a href="shop.html"> <img id="shoplogo" src="store.png" alt="Shop"> </a>
            </li>
            <li>
                <img id="moneylogo" src="money.png" alt="Shop">
            </li>
            <li><h1 id="moneyAmount" class="pixelify-sans">$0.00</h1></li>
         </ul>
    </nav>
    <div class="ticket">

        <div class="ticket-text pixelify-sans">
             <p id="recipe-name">here is an order</p>
             <ul id="recipe-items"></ul>
        </div>
       
        <div class="sendbutton-container">
            <button id="sendbutton" class="send-order-button" type="button"><img src="sendbutton.png" alt="Send order" height="50" width="auto"></button>
        </div>
    </div>
    
<div class="allitems">
    <div class="leftside">

        <button class="ingredient-button" data-ingredient="machine" type="button"><img id="coffee" src="machine.png" alt="Coffee machine"></button>

        <div class="milk-container">
            <button class="ingredient-button" data-ingredient="2percent" type="button"><img id="2%" src="2percent.png" alt="2% milk"></button>
            <button class="ingredient-button" data-ingredient="oat" type="button"><img id="oat" src="oat.png" alt="Oat milk"></button>
            <button class="ingredient-button" data-ingredient="almond" type="button"><img id="almond" src="almond.png" alt="Almond milk"></button>
        </div>

        <div class="drizzles">
            <button class="ingredient-button" data-ingredient="chocolate" type="button"><img id="chocodrizzle" src="drizzle.png" alt="Chocolate" height="100" width="auto"></button>
            <button class="ingredient-button" data-ingredient="strawberry" type="button"><img id="strawberrydrizzle" src="strawberry.png" alt="Strawberry" height="100" width="auto"></button>
        </div>

    </div>
    <div class="rightside">

        <div class="syrups">
            <button class="ingredient-button" data-ingredient="pumpkin" type="button"><img id="pumpkin" src="pumpkin.png" alt="Pumpkin syrup"></button>
            <button class="ingredient-button unlocked" data-ingredient="vanilla" type="button"><img id="vanilla" src="vanilla.png" alt="Vanilla syrup"></button>
            <button class="ingredient-button" data-ingredient="rainbow" type="button"><img id="rainbow" src="rainbow.png" alt="Rainbow syrup"></button>
            <button class="ingredient-button" data-ingredient="choco" type="button"><img id="choco" src="choco.png" alt="Chocolate syrup"></button>
        </div>

        <div class="toppings">
            <button class="ingredient-button" data-ingredient="sprinkles" type="button"><img id="sprinkles" src="sprinkles.png" alt="Sprinkles"></button>
            <button class="ingredient-button" data-ingredient="cinnamon" type="button"><img id="cinnamon" src="cinnamon.png" alt="Ground cinnamon"></button>
            <button class="ingredient-button" data-ingredient="cream" type="button"><img id="whippedcream" src="cream.png" alt="Whipped cream"></button>
            <button class="ingredient-button" data-ingredient="frappe" type="button"><img id="frappe" src="frappe.png" alt="Frappe"></button>
            <button class="ingredient-button" data-ingredient="latte" type="button"><img id="latte" src="latte.png" alt="Latte"></button>
        </div>

    </div>
    
    <div id="gameOverOverlay" class="overlay game-over-overlay" hidden></div>
        <section id="gameOverPopup" class="popup-box game-over-popup" hidden>
            <button id="gameOverClose" class="popup-close" type="button">&times;</button>
            <h2>Time's up!</h2>
            <p>You made <span id="shiftEarnings">$0.00</span> this shift.</p>
        </section>




<script src="main.js" ></script>
</body>
</html>
